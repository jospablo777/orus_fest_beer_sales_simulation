[project]
name = "orus-sim"
version = "0.1.0"
description = "Crowd and beer-sales simulation for Orus Fest at Salón Olímpico Pantitlán"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
site = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "quarto-cli>=1.11.9",
]
