# Text of the organizer pages (site/index.qmd in Spanish, site/en.qmd in English).
# Placeholders in braces are filled by site/_organizer.py from the simulation outputs.

lede:
  es: "En Orus Fest 2026, entre las {obs_from} y las {obs_to}, la fila para canjear una cerveza tomó más de 40 minutos con las fichas ya compradas. Quien no tenía fichas hacía antes la fila de la caja. Con un cambio en la forma de cobrar y el personal indicado abajo, en la noche típica 9 de cada 10 compradores reciben su cerveza en {plan_p90} minutos o menos, y en 19 de cada 20 noches simuladas en {plan_p90_bad} minutos o menos."
  en: "At Orus Fest 2026, between {obs_from} and {obs_to}, the line to exchange tickets for a beer took more than 40 minutes with the tickets already bought. A person without tickets stood in the ticket line first. With one change in how drinks are paid for and the crew listed below, on the typical night 9 of 10 buyers get their beer in {plan_p90} minutes or less, and in 19 of 20 simulated nights in {plan_p90_bad} minutes or less."

h_old:
  es: "Cómo se compraba en 2026"
  en: "How a beer was bought in 2026"
old_text:
  es: "Una sola ventanilla vendía las fichas de todas las bebidas. Con las fichas en la mano había que formarse otra vez para canjearlas. La fila de fichas, la de cocteles y las dos de cerveza salían de la barra hacia el escenario, y las de cocteles y cerveza llegaban hasta la cabina de los ingenieros de luces y drones a media pista. Los baños ocupan la esquina de la barra del lado de la entrada. A las 15:30 comprar era relativamente rápido, y entre las {obs_from} y las {obs_to} la fila de canje tomaba más de 40 minutos; eso lo vimos. La espera más larga no la medimos. Reconstruimos esa noche en una simulación por computadora, y lo que sigue son estimaciones. La simulación reproduce la noche con entre {pour_lo} y {pour_hi} personas sirviendo cerveza. Entre las {obs_from} y las {obs_to} la simulación estima unas {q1} personas en la fila de fichas (entre {q1_lo} y {q1_hi}) y {q2} en las filas de canje (entre {q2_lo} y {q2_hi}). Después de las 20:00 ya no intentamos comprar. Para las 22:00 la simulación estima {night_wait} minutos en la fila de canje (entre {night_wait_lo} y {night_wait_hi})."
  en: "One window sold the tickets for every drink. With the tickets in hand, people stood in line again to exchange them. The ticket line, the cocktail line and the two beer lines ran from the bar toward the stage, and the cocktail and beer lines reached the booth of the lighting and drone engineers in the middle of the floor. The toilets take the corner of the bar on the entrance side. At 15:30 buying was relatively quick, and between {obs_from} and {obs_to} the exchange line took more than 40 minutes; we saw that. We did not measure the longest wait. We rebuilt that night in a computer simulation, and what follows are estimates. The simulation reproduces the night with {pour_lo} to {pour_hi} people serving beer. Between {obs_from} and {obs_to} the simulation estimates about {q1} people in the ticket line (between {q1_lo} and {q1_hi}) and {q2} in the exchange lines (between {q2_lo} and {q2_hi}). After 20:00 we stopped trying to buy. For 22:00 the simulation estimates {night_wait} minutes in the exchange line (between {night_wait_lo} and {night_wait_hi})."

h_new:
  es: "Cómo se compra con el plan"
  en: "How a beer is bought under the plan"
new_text:
  es: "La caja de fichas desaparece. Cada puesto de la barra cobra con tarjeta o efectivo y entrega la cerveza en el mismo momento. Todo el personal de la barra cobra y sirve. Los cocteles se siguen vendiendo en su lugar de 2026."
  en: "The ticket window is removed. Every serving station at the bar takes card or cash and hands over the beer in the same visit. Everyone at the bar takes payment and serves. Cocktails are still sold where they were in 2026."

h_single:
  es: "Qué logra cada cambio por separado"
  en: "What each change achieves on its own"
single_intro:
  es: "Probamos cada cambio por separado sobre la forma de vender de 2026, en las mismas {nights} noches simuladas."
  en: "We tried each change on its own on top of the 2026 way of selling, on the same {nights} simulated nights."
single_head:
  es: ["Cambio", "Personas adicionales en cerveza", "Espera de 9 de cada 10 compradores (min)", "Cervezas adicionales por noche"]
  en: ["Change", "Additional people on beer", "Wait of 9 of 10 buyers (min)", "Additional beers per night"]
single_case:
  baseline: {es: "2026 como fue", en: "2026 as it was"}
  more_cashiers: {es: "4 ventanillas de fichas", en: "4 ticket windows"}
  pay_at_tap: {es: "Cobrar en la barra, con el mismo personal", en: "Payment at the bar, same staff"}
  sellers_6: {es: "6 vendedores en pista, sin cambiar lo demás", en: "6 sellers on the floor, nothing else changed"}
  plan: {es: "El plan completo", en: "The full plan"}
single_base_staff:
  es: "{v} en 2026"
  en: "{v} in 2026"
single_base_beers:
  es: "{v} vendidas en 2026"
  en: "{v} sold in 2026"
single_range:
  es: "{v} ({lo} a {hi})"
  en: "{v} ({lo} to {hi})"
single_text:
  es: "Abrir más ventanillas de fichas casi no cambia la espera, porque la fila se pasa al canje. Cobrar en la barra con el mismo personal ayuda poco. Lo que más reduce la espera es tener más personas sirviendo. Lo que vende cada vendedor es un supuesto, porque en 2026 no hubo vendedores."
  en: "Opening more ticket windows barely changes the wait, because the line moves to the exchange. Payment at the bar with the same staff helps little. What reduces the wait most is having more people serving. What each seller sells is an assumption, because there were no sellers in 2026."
single_more:
  es: "Las demás combinaciones están en el [reporte técnico](technical.qmd#the-plan-against-the-alternatives)."
  en: "The other combinations are in the [technical report](technical.qmd#the-plan-against-the-alternatives)."

h_gain:
  es: "Qué gana cada quien"
  en: "What each group gains"
tile_audience_v: {es: "40+ → {plan_wait} min", en: "40+ → {plan_wait} min"}
tile_audience:
  es: "<strong>Un público más contento.</strong> Tiempo en la fila para recibir la cerveza entre las {obs_from} y las {obs_to}. En 2026 vimos más de 40 minutos en la fila de canje; la simulación estima {base_exchange} (entre {base_exchange_lo} y {base_exchange_hi}). Con el plan la fila toma {plan_wait}."
  en: "<strong>A happier audience.</strong> Time in line to get the beer between {obs_from} and {obs_to}. In 2026 we saw more than 40 minutes in the exchange line; the simulation estimates {base_exchange} (between {base_exchange_lo} and {base_exchange_hi}). Under the plan the line takes {plan_wait}."
tile_staff_v: {es: "{base_maxq} → {plan_maxq}", en: "{base_maxq} → {plan_maxq}"}
tile_staff:
  es: "<strong>Menos presión para el personal.</strong> Máximo estimado de personas formadas al mismo tiempo (en 2026 entre {base_maxq_lo} y {base_maxq_hi}). Las compras abandonadas en la noche bajan de unas {base_lost} (entre {base_lost_lo} y {base_lost_hi}) a {plan_lost}."
  en: "<strong>Less stress for the staff.</strong> Estimated most people standing in line at the same time (in 2026 between {base_maxq_lo} and {base_maxq_hi}). Purchases abandoned during the night drop from about {base_lost} (between {base_lost_lo} and {base_lost_hi}) to {plan_lost}."
tile_sales_v: {es: "+{d_beers}", en: "+{d_beers}"}
tile_sales:
  es: "<strong>Más bebidas vendidas.</strong> Cervezas adicionales por noche (entre {d_beers_lo} y {d_beers_hi}). A {price} pesos la cerveza son cerca de {d_mxn} pesos más en ventas (entre {d_mxn_lo} y {d_mxn_hi}). Sin contar costos."
  en: "<strong>More drinks sold.</strong> Extra beers per night (between {d_beers_lo} and {d_beers_hi}). At MXN {price} a beer that is about MXN {d_mxn} more in sales (between {d_mxn_lo} and {d_mxn_hi}). Costs not included."
tile_reputation_v: {es: "{base_hours} → {plan_hours} h", en: "{base_hours} → {plan_hours} h"}
tile_reputation:
  es: "<strong>Mejor reputación para Orus Producciones.</strong> Horas que el público pasa en filas y pierde del show, sumando a todas las personas (estimado; en 2026 entre {base_hours_lo} y {base_hours_hi}). La noche mejora en {improved_n} de {nights} noches simuladas."
  en: "<strong>A better reputation for Orus Producciones.</strong> Hours the audience spends in lines and loses from the show, adding everyone up (estimated; in 2026 between {base_hours_lo} and {base_hours_hi}). The night improves in {improved_n} of {nights} simulated nights."

h_plan:
  es: "El plan en seis acciones"
  en: "The plan in six actions"
plan_alt:
  es: "Plano del salón con el plan: puestos de la barra con carriles, vendedores en pista y pasillo central libre"
  en: "Floor plan of the hall under the plan: bar stations with lanes, sellers on the floor and an open central walkway"
a1_t: {es: "Cobrar y servir en el mismo puesto.", en: "Take payment where the beer is served."}
a1:
  es: "Tarjeta o efectivo en cada puesto de la barra. Sin caja de fichas y sin segunda fila."
  en: "Card or cash at every station of the bar. No ticket window and no second line."
a2_t: {es: "{crew_es} para {tickets} boletos.", en: "{crew_en} for {tickets} tickets."}
a2:
  es: "{rec_sentence_es} En 2026 eran unas {staff_2026} contando la ventanilla (entre {staff_2026_lo} y {staff_2026_hi}). Cumple la meta de espera en {rec_met} de {rec_nights} noches simuladas. Todos en su puesto antes de las 18:00, que es cuando empezaron las filas en 2026."
  en: "{rec_sentence_en} In 2026 there were about {staff_2026}, counting the ticket window (between {staff_2026_lo} and {staff_2026_hi}). It meets the waiting target in {rec_met} of {rec_nights} simulated nights. Everyone in place before 18:00, when the 2026 lines started."
rec_sentence:
  es: "El personal recomendado son {staff_plan} personas en cerveza."
  en: "The recommended crew is {staff_plan} people on beer."
rec_fallback:
  es: "Ninguna opción probada cumple la meta en el {reliability_rec} de las noches, así que el plan usa el personal mínimo: {staff_plan} personas en cerveza."
  en: "No option tested meets the target in {reliability_rec} of the nights, so the plan uses the minimum crew: {staff_plan} people on beer."
min_sentence:
  es: "El personal mínimo ({min_crew_short_es}) cumple en {min_met} de {min_nights} noches{min_close_es}. La diferencia {grows_es} cuando faltan dos personas en la barra: el mínimo cumple en {min_absent_met} de {min_absent_nights} noches y el recomendado en {rec_absent_met} de {rec_absent_nights}."
  en: "The minimum crew ({min_crew_short_en}) meets it in {min_met} of {min_nights} nights{min_close_en}. The difference {grows_en} when two bartenders are absent: the minimum crew meets it in {min_absent_met} of {min_absent_nights} nights and the recommended crew in {rec_absent_met} of {rec_absent_nights}."
min_close:
  es: ", casi lo mismo"
  en: ", almost the same"
min_grows:
  close: {es: "aparece", en: "shows"}
  apart: {es: "crece", en: "grows"}
grid_edge:
  es: "El número más alto de vendedores que probamos fue {max_sellers}."
  en: "The largest number of sellers we tested was {max_sellers}."
a3_t_sellers: {es: "Vendedores en pista de {sellers_from} a {sellers_to}.", en: "Sellers on the floor from {sellers_from} to {sellers_to}."}
a3_sellers:
  es: "Llevan cerveza a quienes guardan su lugar frente al escenario durante las bandas principales. Venden cerca del {seller_share} de la cerveza del plan (entre {seller_share_lo} y {seller_share_hi}). {alt_es}"
  en: "They take beer to the people holding a place in front of the stage during the main bands. They sell about {seller_share} of the beer under the plan (between {seller_share_lo} and {seller_share_hi}). {alt_en}"
a3_t_none: {es: "Vendedores en pista solo si faltan puestos en la barra.", en: "Sellers on the floor only if the bar is short of stations."}
a3_none:
  es: "Con los puestos indicados la barra alcanza. Si el mostrador no da para tantos puestos, los vendedores cubren la diferencia."
  en: "With the stations listed the bar is enough. If the counter cannot fit that many stations, sellers cover the difference."
alt_ok:
  es: "Sin vendedores, {alt_crew_es} cumplen la meta en {alt_met} de {alt_nights} noches simuladas; esa es la alternativa si no hay vendedores."
  en: "Without sellers, {alt_crew_en} meet the target in {alt_met} of {alt_nights} simulated nights; that is the alternative if there are no sellers."
alt_none:
  es: "Sin vendedores, ninguna opción probada cumple la meta: con {alt_crew_es} se cumple en {alt_met} de {alt_nights} noches simuladas."
  en: "Without sellers, no option tested meets the target: with {alt_crew_en} it is met in {alt_met} of {alt_nights} simulated nights."
alt_crew:
  es: "12 puestos en la barra y una segunda barra de 4 puestos"
  en: "12 stations at the bar and a second bar with 4 stations"
a4_t: {es: "Un carril con vallas o unifilas por puesto.", en: "One lane with barriers per station."}
a4:
  es: "Las filas avanzan derechas hacia la barra y dejan libre la pista. Esta acción viene de las guías de manejo de multitudes; la simulación no la mide."
  en: "Lines run straight to the bar and leave the floor free. This action comes from crowd-management guidance; the simulation does not measure it."
a5_t: {es: "Pista central libre y venta de boletos dentro del aforo autorizado.", en: "Open central floor and ticket sales within the licensed capacity."}
a5:
  es: "Con {tickets} boletos hay unas {inside_peak} personas dentro en el momento más lleno. {cap_sentence_es}"
  en: "With {tickets} tickets about {inside_peak} people are inside at the fullest moment. {cap_sentence_en}"
a6_t: {es: "Límite de bebidas por compra, agua gratis y seguridad junto a la barra.", en: "A limit of drinks per purchase, free water and security next to the bar."}
a6:
  es: "Con un servicio más rápido la gente bebe más. Quienes toman 6 cervezas o más pasan del {heavy_base} al {heavy_plan} del público. El personal no debe servir a personas visiblemente ebrias."
  en: "With faster service people drink more. Attendees with 6 beers or more go from {heavy_base} to {heavy_plan} of the audience. Staff should refuse service to visibly intoxicated people."

h_video:
  es: "Así se ve la noche"
  en: "Watch the night"
video_night:
  es: "La misma noche con las dos formas de vender, de {clip_from} a {clip_to}. Cada punto es una persona. A la izquierda, 2026. A la derecha, el plan. Después de las 20:00 el lado de 2026 es una estimación. Los cuadros detrás de la barra son las personas que atienden: vacíos si están libres, claros si cobran y dorados si sirven."
  en: "The same night under both ways of selling, {clip_from} to {clip_to}. Each dot is one person. On the left, 2026. On the right, the plan. After 20:00 the 2026 side is an estimate. The squares behind the bar are the bar staff: hollow when free, light when charging and gold when serving."
video_change:
  es: "Cámara lenta del momento más pesado de la noche. Funker Vogt termina a las 21:25 y el público va por cerveza antes de Peter Heppner. A esa hora el lado de 2026 es una estimación."
  en: "Slow motion of the heaviest moment of the night. Funker Vogt ends at 21:25 and the audience goes for beer before Peter Heppner. At that hour the 2026 side is an estimate."

h_staff:
  es: "Personal y ventas por hora"
  en: "Staff and sales by the hour"
staff_intro:
  es: "El plan usa {staff_plan} personas en cerveza y en 2026 eran unas {staff_2026}. Son unas {extra_hours} horas de trabajo más por noche. Cada hora adicional vende unas {per_hour} cervezas (entre {per_hour_lo} y {per_hour_hi}), unos {per_hour_mxn} pesos en ventas {price_note_es}, sin contar costos."
  en: "The plan uses {staff_plan} people on beer and in 2026 there were about {staff_2026}. That is about {extra_hours} more working hours per night. Each extra hour sells about {per_hour} beers (between {per_hour_lo} and {per_hour_hi}), about MXN {per_hour_mxn} in sales {price_note_en}, costs not included."
staff_text:
  es: "La meta es que 9 de cada 10 compradores esperen {target_wait} minutos o menos entre las {svc_from} y las {svc_to}. Cada barra de la gráfica es una opción de personal y muestra en cuántas de {crew_nights} noches simuladas se cumple la meta, de menos a más horas de trabajo hasta el personal completo."
  en: "The target is that 9 of 10 buyers wait {target_wait} minutes or less between {svc_from} and {svc_to}. Each bar of the chart is a crew option and shows in how many of {crew_nights} simulated nights the target is met, from fewer to more working hours up to the complete crew."
alone_sentence:
  es: " También incluye la opción sin vendedores más chica que cumple la meta en al menos el {reliability} de las noches."
  en: " It also includes the smallest option without sellers that meets the target in at least {reliability} of the nights."
staff_table_head:
  es: ["Boletos", "Personal", "Puestos en la barra", "Vendedores en pista", "Personas en total", "Horas de trabajo por noche", "Noches que cumplen la meta", "Personas dentro en el pico"]
  en: ["Tickets", "Crew", "Stations at the bar", "Sellers on the floor", "People in total", "Working hours per night", "Nights that meet the target", "People inside at the peak"]
crew_level:
  minimum: {es: "mínimo", en: "minimum"}
  recommended: {es: "recomendado", en: "recommended"}
  fallback: {es: "recomendado (igual al mínimo)", en: "recommended (same as minimum)"}
  complete: {es: "completo", en: "complete"}
staff_table_head_short:
  es: ["Boletos", "Nivel", "Puestos + vendedores · personas · horas", "Noches que cumplen la meta"]
  en: ["Tickets", "Level", "Stations + sellers · people · hours", "Nights that meet the target"]
staff_none:
  es: "ninguna opción probada cumple la meta"
  en: "no option tested meets the target"
sales_text:
  es: "La venta sigue al horario de las bandas. Antes de las 18:00 se venden menos de {low_hour} cervezas por hora. La hora más fuerte llega a unas {peak_hour} cervezas (entre {peak_hour_lo} y {peak_hour_hi}). Se estima que en 2026 la hora más fuerte de la barra fue de unas {base_peak_hour} cervezas (entre {base_peak_hour_lo} y {base_peak_hour_hi})."
  en: "Sales follow the running order. Before 18:00 fewer than {low_hour} beers are sold per hour. The busiest hour reaches about {peak_hour} beers (between {peak_hour_lo} and {peak_hour_hi}). In 2026 the busiest hour of the bar is estimated at about {base_peak_hour} beers (between {base_peak_hour_lo} and {base_peak_hour_hi})."
whatif_intro:
  es: "Probamos el plan en noches distintas. La tabla da la espera de 9 de cada 10 compradores en la noche típica y en cuántas de {wi_nights} noches simuladas se cumple la meta de {target_wait} minutos. “Cumple” quiere decir al menos el {reliability} de las noches. “Cerca de la meta” quiere decir menos, pero tan poco que con {wi_nights} noches la diferencia puede ser azar. “Lejos de la meta” quiere decir que la diferencia no se explica por azar."
  en: "We tried the plan on different nights. The table gives the wait of 9 of 10 buyers on the typical night and in how many of {wi_nights} simulated nights the {target_wait}-minute target is met. “Meets the target” means at least {reliability} of the nights. “Close to the target” means fewer, by so little that with {wi_nights} nights the difference can be chance. “Far from the target” means the difference is not explained by chance."
whatif_head:
  es: ["Caso", "Espera de 9 de cada 10 (min, noche típica)", "Noches que cumplen la meta", "Resultado"]
  en: ["Case", "Wait of 9 of 10 buyers (min, typical night)", "Nights that meet the target", "Result"]
wi_status:
  met: {es: "cumple", en: "meets the target"}
  near: {es: "cerca de la meta", en: "close to the target"}
  far: {es: "lejos de la meta", en: "far from the target"}

wi_case:
  plan: {es: "El plan, personal recomendado", en: "The plan, recommended crew"}
  plan_minimum: {es: "El plan con el personal mínimo", en: "The plan with the minimum crew"}
  plan_two_absent: {es: "Faltan dos personas en la barra", en: "Two bartenders are absent"}
  plan_minimum_two_absent: {es: "Personal mínimo y faltan dos personas", en: "Minimum crew and two bartenders absent"}
  plan_sold_out: {es: "Se venden 2,500 boletos", en: "2,500 tickets are sold"}
  plan_thirsty: {es: "El público bebe 30% más", en: "The audience drinks 30% more"}
  plan_slow_pay: {es: "Cobrar toma 25 segundos", en: "Payment takes 25 seconds"}
  plan_late_sellers: {es: "Los vendedores empiezan a las 19:00", en: "Sellers start at 19:00"}
  plan_slow_refill: {es: "Un vendedor tarda 4 minutos en recargar", en: "A seller refill takes 4 minutes"}
  no_sellers: {es: "Sin vendedores: 12 puestos y una segunda barra de 4", en: "No sellers: 12 stations and a second bar with 4"}

h_serve:
  es: "Servir más rápido"
  en: "Serving faster"
serve_intro:
  es: "En 2026 cada cerveza se destapaba y se servía en un vaso, y una grande llevaba dos. Probamos otras formas de servir en las mismas {serve_nights} noches simuladas, con {tickets} boletos. Nadie midió cuánto tiempo ahorra cada una, así que los segundos de la tabla son supuestos nuestros."
  en: "In 2026 every beer was opened and poured into a cup, and a large beer took two. We tried other ways of serving on the same {serve_nights} simulated nights, with {tickets} tickets. Nobody measured how much time each one saves, so the seconds in the table are our assumptions."
serve_head:
  es: ["Forma de servir (supuesto)", "Espera de 9 de cada 10 con el personal del plan (min, noche típica / noche mala)", "Noches que cumplen la meta con el personal del plan", "Horas de trabajo que se ahorran para cumplir en el 95% de las noches"]
  en: ["Way of serving (assumption)", "Wait of 9 of 10 buyers with the plan crew (min, typical night / bad night)", "Nights that meet the target with the plan crew", "Working hours saved to meet the target in 95% of nights"]
serve_best:
  es: "Con {best_label} se necesitan unas {hours} horas de trabajo menos por noche para cumplir la meta en el 95% de las noches."
  en: "With {best_label} about {hours} fewer working hours per night are needed to meet the target in 95% of nights."
serve_cans_range:
  es: "Si las latas ahorran {low_s} segundos por cerveza, se ahorran unas {low_hours} horas; si ahorran {high_s}, unas {high_hours}."
  en: "If cans save {low_s} seconds per beer, about {low_hours} hours are saved; if they save {high_s}, about {high_hours}."
serve_fewer_sellers:
  es: ", y depende menos de los vendedores: {s} en lugar de {b}"
  en: ", and it depends less on sellers: {s} in place of {b}"
serve_none:
  es: "Ninguna de estas formas reduce el personal recomendado; con el mismo personal la espera cambia como indica la tabla."
  en: "None of these ways reduces the recommended crew; with the same crew the wait changes as the table shows."
serve_notes:
  es: "Entregar latas cerradas depende de las reglas del salón y de seguridad sobre latas en la pista. La cerveza de barril necesita barriles fríos, gas y espacio en la barra, y el salón quizá no está preparado para eso; conviene preguntarlo antes de decidir. Cronometrar unas cuantas ventas en la próxima edición diría cuánto ahorra cada opción en realidad."
  en: "Handing over closed cans depends on the venue's rules and on security policy about cans on the floor. Draft beer needs cold kegs, gas and space at the bar, and the venue may not be equipped for it; ask before deciding. Timing a few sales at the next edition would show how much each option really saves."
serve_option:
  bottles: {es: "Botella o lata destapada y servida en vaso (como en 2026)", en: "Bottle or can opened and poured into a cup (as in 2026)"}
  cans: {es: "Latas cerradas", en: "Closed cans"}
  cans_low: {es: "Latas cerradas, ahorro chico", en: "Closed cans, small saving"}
  cans_high: {es: "Latas cerradas, ahorro grande", en: "Closed cans, large saving"}
  tap: {es: "Cerveza de barril", en: "Draft beer"}
  fast_pay: {es: "Cobro más rápido (tarjeta sin contacto o pulsera, precio redondo)", en: "Faster payment (contactless card or wristband, a round price)"}
  cans_fast_pay: {es: "Latas cerradas y cobro más rápido", en: "Closed cans and faster payment"}
