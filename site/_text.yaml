wait_caption:
  es: "La línea es la noche típica y la franja el rango entre noches simuladas. El tiempo cuenta hasta recibir la cerveza o hasta salirse de la fila. La simulación se ajustó a lo que vimos hasta las 20:00; después de esa hora la curva de 2026 es una estimación. En 2026 la espera sube desde las 18:00 y sigue alta hasta el cierre."
  en: "The line is the typical night and the band the range across simulated nights. Time counts until the beer is received or the person leaves the line. The simulation was fitted to what we saw up to 20:00; after that hour the 2026 curve is an estimate. In 2026 the wait rises from 18:00 and stays high until closing."

