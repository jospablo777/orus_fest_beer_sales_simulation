h_conf:
  es: "Qué tan firme es cada resultado"
  en: "How firm each result is"
conf_firm_t: {es: "Firme", en: "Firm"}
conf_firm:
  es: "Quitar la caja de fichas y cobrar en la barra mejora la noche en {improved_n} de {nights} noches simuladas."
  en: "Removing the ticket window and taking payment at the bar improves the night in {improved_n} of {nights} simulated nights."
conf_prob_t: {es: "Probable", en: "Probable"}
conf_prob:
  es: "En el plan los vendedores en pista venden cerca del {seller_share} de la cerveza. En 2026 no hubo vendedores, así que lo que vende cada uno es un supuesto. {alt_sentence_es} Recomendamos probar a los vendedores antes en un evento más chico y anotar cuántas cervezas vende cada uno por hora y cuánto tarda en recargar. El tiempo para servir una cerveza tampoco se midió en 2026; conviene cronometrarlo y tener una persona de reserva."
  en: "Under the plan the floor sellers sell about {seller_share} of the beer. There were no sellers in 2026, so what each one sells is an assumption. {alt_sentence_en} We recommend trying the sellers first at a smaller event and recording how many beers each one sells per hour and how long a refill takes. The time to serve a beer was not measured in 2026 either; time it and keep one person in reserve."
conf_check_t: {es: "Por revisar", en: "To be checked"}
conf_check:
  es: "La espera más larga de 2026 no se midió. Vimos más de 40 minutos en la fila de canje, y la simulación supone que la espera típica de esa fila no pasó de {wait_max} minutos, un límite que pusimos nosotros. {no_limit_es} El tamaño del salón se estimó de una imagen satelital con un margen de {hall_side} por lado, así que el límite de boletos por espacio también es aproximado. {cap_strict_es} El aforo autorizado es el que decide. La evacuación y los cocteles quedaron fuera del estudio."
  en: "The longest wait of 2026 was not measured. We saw more than 40 minutes in the exchange line, and the simulation assumes that the typical wait in that line did not pass {wait_max} minutes, a limit we set ourselves. {no_limit_en} The hall size was estimated from a satellite image with a margin of {hall_side} per side, so the ticket limit by floor space is approximate as well. {cap_strict_en} The licensed capacity is what decides. Evacuation and cocktails were left out of the study."
no_limit:
  es: "Sin ese límite la simulación estima {ref_exchange} minutos en la fila de canje (entre {ref_exchange_lo} y {ref_exchange_hi}) en lugar de {base_exchange}, y el personal del plan cumple la meta en {ref_plan_met} de {ref_plan_nights} noches."
  en: "Without that limit the simulation estimates {ref_exchange} minutes in the exchange line (between {ref_exchange_lo} and {ref_exchange_hi}) instead of {base_exchange}, and the plan crew meets the target in {ref_plan_met} of {ref_plan_nights} nights."
cap_strict:
  es: "La lectura más estricta de la misma norma ({lim_large} personas por m²) pone el límite {cap_large_es}."
  en: "The stricter reading of the same code ({lim_large} people per m²) puts the limit {cap_large_en}."

h_need:
  es: "Datos que mejorarían el plan"
  en: "Records that would improve the plan"
need_text:
  es: "Compartir estos datos es opcional. Con ellos el análisis sería más preciso, los rangos de este reporte se reducirían y podríamos ajustar el plan a su operación. Nos sirve cualquiera de ellos, aunque no estén todos. Pueden enviarlos a {author} por <a href=\"{contact_url}\">{contact_label}</a>."
  en: "Sharing these records is optional. With them the analysis would be more accurate, the ranges in this report would narrow and we could fit the plan to your operation. Any one of them helps, even if not all are available. They can be sent to {author} on <a href=\"{contact_url}\">{contact_label}</a>."
need_check:
  es: "Las cervezas vendidas, los boletos vendidos y las personas en la barra también sirven para comprobar el estudio. Si sus cifras quedan fuera de estos rangos, lo recalculamos con ellas."
  en: "Beers sold, tickets sold and people at the bar also serve to check the study. If your figures fall outside these ranges, we recalculate with them."
need_quick_lead:
  es: "Tres preguntas que se responden en un minuto y cambian qué opciones conviene estudiar."
  en: "Three questions that take a minute to answer and change which options are worth studying."
need_quick:
  es:
    - ["¿El salón permite entregar latas cerradas al público o exige servir en vaso?", "Con latas cerradas, la cerveza en lata y los cocteles en lata se vuelven opciones que acortan el servicio."]
    - ["¿Quién opera la barra y recibe la venta de bebidas: Orus Producciones, el salón o un concesionario?", "Define quién decide sobre el personal y quién recibe las ventas adicionales."]
    - ["¿Cuánto cuesta una hora de trabajo en la barra, o un turno y cuántas horas dura?", "Permite comparar el costo del personal con las ventas adicionales."]
  en:
    - ["Does the venue allow closed cans to be handed to the audience, or does it require serving in cups?", "With closed cans, canned beer and canned cocktails become options that shorten the service."]
    - ["Who runs the bar and receives the drink sales: Orus Producciones, the venue or a concessionaire?", "It defines who decides on the staff and who receives the extra sales."]
    - ["What does one working hour at the bar cost, or one shift and how many hours it lasts?", "It lets us compare the cost of the crew with the extra sales."]
need_estimates:
  es:
    - "La simulación estima unas {chk_beers} cervezas vendidas (entre {chk_beers_lo} y {chk_beers_hi})."
    - "El estudio supone {chk_tickets} boletos y unas {chk_inside} personas dentro en el momento más lleno (entre {chk_inside_lo} y {chk_inside_hi})."
    - "La simulación reproduce la noche con {chk_pour_lo} a {chk_pour_hi} personas sirviendo cerveza en {chk_pour_k} de {chk_pour_n} noches simuladas."
  en:
    - "The simulation estimates about {chk_beers} beers sold (between {chk_beers_lo} and {chk_beers_hi})."
    - "The study assumes {chk_tickets} tickets and about {chk_inside} people inside at the fullest moment (between {chk_inside_lo} and {chk_inside_hi})."
    - "The simulation reproduces the night with {chk_pour_lo} to {chk_pour_hi} people serving beer in {chk_pour_k} of {chk_pour_n} simulated nights."
needs:
  es:
    - "Cervezas vendidas en la noche (compradas menos sobrantes)."
    - "Boletos vendidos y hora de entrada de cada boleto, de la plataforma de boletos."
    - "Personas en la barra por hora, precios y cuánto se cobró en efectivo y con tarjeta."
    - "Margen por cerveza, para comparar ventas con costos."
    - "Aforo autorizado del salón, y ubicación y ancho de cada salida."
    - "Relatos de asistentes: cuánto tiempo hicieron fila para recibir su bebida, cuántas bebidas y de qué tipo pidieron, y si hicieron solo la fila de bebidas o también la de fichas. Una encuesta corta a quienes compraron boleto sirve."
    - "Fotografías o videos de las filas de fichas y de la barra, con la hora en que se tomaron."
  en:
    - "Beers sold during the night (bought minus left over)."
    - "Tickets sold and the entry time of each ticket, from the ticketing platform."
    - "People at the bar by hour, prices, and the split between cash and card."
    - "Margin per beer, to compare sales with costs."
    - "Licensed capacity of the hall, and the position and width of every exit."
    - "Reports from attendees: how long they stood in line to get their drink, how many drinks and which kind they asked for, and whether they stood only in the drink line or also in the ticket line. A short survey of ticket buyers works."
    - "Photos or videos of the ticket and bar lines, with the time each one was taken."

h_how:
  es: "Cómo se hizo"
  en: "How this was done"
how_text:
  es: "Un modelo por computadora mueve a {tickets} asistentes por el salón de las 13:00 a las 03:00 con el horario oficial de las bandas. Cada persona llega, ve a sus bandas, tiene sed, elige fila y se cansa de esperar. Lo que nadie midió (cuánto bebe la gente, cuánto tarda servir) se probó en {sims} noches simuladas, y se conservaron las que reproducen lo que vimos en 2026: compra relativamente rápida a las 15:30, más de 40 minutos en la fila de canje entre las {obs_from} y las {obs_to} (y no más de {wait_max}, el límite que supusimos), filas largas tanto en fichas como en canje, y mucha gente que se daba por vencida. Cada cambio se evaluó en {nights} de esas noches. Los rangos de esta página cubren 9 de cada 10 noches simuladas. El detalle está en las páginas técnicas, en inglés. Resultados del {date}."
  en: "A computer model moves {tickets} attendees through the hall from 13:00 to 03:00 on the official running order. Each person arrives, watches their bands, gets thirsty, picks a line and gives up after waiting too long. What nobody measured (how much people drink, how long serving takes) was tried in {sims} simulated nights, and the ones that reproduce what we saw in 2026 were kept: a relatively quick purchase at 15:30, more than 40 minutes in the exchange line between {obs_from} and {obs_to} (and no more than {wait_max}, the limit we assumed), long lines at both the ticket window and the exchange, and a lot of people giving up. Each change was evaluated on {nights} of those nights. The ranges on this page cover 9 of 10 simulated nights. The details are in the technical pages. Results of {date}."
links:
  es: "[Reporte técnico](technical.qmd) · [Métodos](methods.qmd) · [Supuestos](assumptions.qmd) · [Literatura](literature.qmd)"
  en: "[Technical report](technical.qmd) · [Methods](methods.qmd) · [Assumptions](assumptions.qmd) · [Literature](literature.qmd)"

preview_note:
  es: "El reporte técnico, los métodos, los supuestos y la literatura están en el sitio completo del estudio."
  en: "The technical report, methods, assumptions and literature are on the full site of the study."

