# ---- Evidence page (site/evidencia.qmd, site/evidence.qmd) -------------------------------
ev_h1: {es: "Cómo se compraba en 2026 y cómo se compra con el plan", en: "How a beer was bought in 2026 and how it is bought under the plan"}
ev_lead1:
  es: "En 2026 una cerveza pedía dos filas; con el plan pide una."
  en: "In 2026 a beer took two lines; under the plan it takes one."
ev_text1:
  es: "Una ventanilla vendía las fichas de todas las bebidas y después había que formarse para canjearlas. Las filas salían de la barra hacia el escenario y llegaban hasta la cabina de los ingenieros de luces y drones. Los baños ocupan la esquina de la barra del lado de la entrada. Vimos más de 40 minutos en la fila de canje entre las {obs_from} y las {obs_to}; la simulación estima {base_exchange} (entre {base_exchange_lo} y {base_exchange_hi}), con unas {q1} personas en la fila de fichas y {q2} en las de canje."
  en: "One window sold the tickets for every drink, and then people lined up again to exchange them. The lines ran from the bar toward the stage and reached the booth of the lighting and drone engineers. The toilets take the corner of the bar on the entrance side. We saw more than 40 minutes in the exchange line between {obs_from} and {obs_to}; the simulation estimates {base_exchange} (between {base_exchange_lo} and {base_exchange_hi}), with about {q1} people in the ticket line and {q2} in the exchange lines."
ev_h2: {es: "Así se ve la noche", en: "Watch the night"}
ev_lead2:
  es: "En la misma noche simulada, en 2026 llegan a estar formadas unas {base_maxq} personas al mismo tiempo; con el plan, unas {plan_maxq}."
  en: "On the same simulated night, up to about {base_maxq} people stand in line at once in 2026; under the plan, about {plan_maxq}."
ev_h3: {es: "Lo que más reduce la espera es tener más personas sirviendo", en: "What cuts the wait most is more people serving"}
ev_lead3:
  es: "Con el mismo personal, abrir ventanillas o cobrar en la barra deja la espera de 9 de cada 10 compradores en {best_single} minutos o más; con el plan baja a {plan_p90}."
  en: "With the same staff, opening ticket windows or charging at the bar leaves the wait of 9 of 10 buyers at {best_single} minutes or more; under the plan it drops to {plan_p90}."
ev_changes_cap:
  es: "Espera de 9 de cada 10 compradores entre las {svc_from} y las {svc_to}, noche típica y rango entre noches. Al final de cada barra, las cervezas adicionales por noche."
  en: "Wait of 9 of 10 buyers between {svc_from} and {svc_to}, typical night and range across nights. At the end of each bar, the extra beers per night."
ev_h4: {es: "El personal: tres niveles", en: "Staff: three levels"}
ev_lead4:
  es: "El personal recomendado, {crew_es}, cumple la meta en {rec_met} de {rec_nights} noches y es el que mejor resiste cuando la noche sale mal."
  en: "The recommended crew, {crew_en}, meets the target in {rec_met} of {rec_nights} nights and holds up best when the night goes wrong."
ev_plan_legend:
  es: "Cuadros detrás de la barra: personas que atienden. Puntos verdes: vendedores en pista. Líneas blancas: un carril con vallas por puesto. Flecha: pasillo central libre."
  en: "Squares behind the bar: bar staff. Green dots: floor sellers. White lines: one lane with barriers per station. Arrow: open central walkway."
ev_levels:
  es: "Hay tres niveles para {tickets} boletos. Mínimo: {min_crew_es}, cumple en {min_met} de {min_nights} noches y en {min_worst} de {min_nights} en el peor caso. Recomendado: {crew_es}, cumple en {rec_met} de {rec_nights} y en {rec_worst} en el peor caso. Completo: {full_crew_es}, cumple en {full_met} de {full_nights} y en {full_worst} en el peor caso. En cada nivel varias combinaciones con casi las mismas horas de trabajo cumplen igual, y con {nights} noches no se distinguen; elegimos la que cumple en más noches cuando faltan personas, los vendedores llegan tarde o hay más público."
  en: "There are three levels for {tickets} tickets. Minimum: {min_crew_en}, met in {min_met} of {min_nights} nights and in {min_worst} of {min_nights} in the worst case. Recommended: {crew_en}, met in {rec_met} of {rec_nights} and in {rec_worst} in the worst case. Complete: {full_crew_en}, met in {full_met} of {full_nights} and in {full_worst} in the worst case. At each level several mixes with almost the same working hours do equally well, and {nights} nights cannot tell them apart; we chose the one that meets the target in the most nights when people are missing, sellers start late or the crowd is larger."
ev_mixes_cap:
  es: "Combinaciones de personal con casi las mismas horas de trabajo: noches que cumplen la meta en la noche base y en el peor de siete casos de estrés."
  en: "Crew mixes with almost the same working hours: nights that meet the target in the base case and in the worst of seven stress cases."
ev_counter:
  es: "Con {plan_taps} puestos cada uno tiene unos {counter_m} m de barra{counter_flag}."
  en: "With {plan_taps} stations each one has about {counter_m} m of counter{counter_flag}."
ev_counter_alt:
  es: "Si en la barra no caben {plan_taps} personas, {alt_taps} en la barra y {alt_sellers} en pista dan casi el mismo resultado: {alt_base} de {alt_nights} noches en la noche base y {alt_worst} de {alt_nights} en el peor caso."
  en: "If the bar cannot fit {plan_taps} people, {alt_taps} at the bar and {alt_sellers} on the floor give almost the same result: {alt_base} of {alt_nights} nights on the base night and {alt_worst} of {alt_nights} in the worst case."
ev_counter_flag: {es: "; menos de 1 m es poco espacio por persona", en: "; under 1 m is tight per person"}
ev_surcharge:
  es: "Con {surcharge} pesos más por boleto y {paying} boletos se reúnen {budget} pesos. Eso cubre el personal completo si la hora de trabajo cuesta menos de {cost_limit} pesos."
  en: "With MXN {surcharge} more per ticket and {paying} tickets, MXN {budget} is raised. That covers the complete crew if a working hour costs less than MXN {cost_limit}."
ev_h5: {es: "La barra hora por hora", en: "The bar hour by hour"}
ev_lead5:
  es: "La venta sube desde las 18:00; en 2026 la barra estaba ocupada {busy_base} del tiempo y con el plan {busy_plan}."
  en: "Sales rise from 18:00; in 2026 the bar was busy {busy_base} of the time and under the plan {busy_plan}."
ev_busy_cap:
  es: "Porcentaje del tiempo que las personas de la barra están cobrando o sirviendo, por hora. Noche típica y rango entre noches."
  en: "Share of time the bar staff are charging or serving, by hour. Typical night and range across nights."
ev_small:
  es: [["{base_maxq} → {plan_maxq}", "personas formadas al mismo tiempo, máximo (en 2026 entre {base_maxq_lo} y {base_maxq_hi})"],
       ["{base_lost} → {plan_lost}", "compras abandonadas en la noche (en 2026 entre {base_lost_lo} y {base_lost_hi})"],
       ["{base_hours} → {plan_hours} h", "horas que el público pasa en filas, sumando a todos (en 2026 entre {base_hours_lo} y {base_hours_hi})"]]
  en: [["{base_maxq} → {plan_maxq}", "people in line at the same time, at most (in 2026 between {base_maxq_lo} and {base_maxq_hi})"],
       ["{base_lost} → {plan_lost}", "purchases abandoned during the night (in 2026 between {base_lost_lo} and {base_lost_hi})"],
       ["{base_hours} → {plan_hours} h", "hours the audience spends in lines, everyone added up (in 2026 between {base_hours_lo} and {base_hours_hi})"]]
ev_h6: {es: "Si la noche sale distinta", en: "If the night turns out different"}
ev_lead6:
  es: "Con el personal recomendado se cumple la meta en al menos el {reliability} de las noches en {wi_ok} de {wi_cases} casos distintos; el más difícil es este: {wi_worst} ({wi_worst_met} de {wi_nights} noches)."
  en: "With the recommended crew the target is met in at least {reliability} of the nights in {wi_ok} of {wi_cases} different cases; the hardest is this one: {wi_worst} ({wi_worst_met} of {wi_nights} nights)."
ev_h7: {es: "Servir más rápido", en: "Serving faster"}
ev_lead7:
  es: "Latas cerradas y cobro más rápido permiten el mismo servicio con menos horas de trabajo."
  en: "Closed cans and faster payment give the same service with fewer working hours."
ev_h8: {es: "Cuidados: aforo, bebidas, agua y seguridad", en: "Care: capacity, drinks, water and security"}
ev_lead8:
  es: "Con un servicio más rápido la gente bebe más: quienes toman 6 cervezas o más pasan del {heavy_base} al {heavy_plan} del público."
  en: "With faster service people drink more: attendees with 6 beers or more go from {heavy_base} to {heavy_plan} of the audience."
ev_h9: {es: "Qué tan firme es cada resultado", en: "How firm each result is"}
ev_lead9:
  es: "Quitar la caja de fichas mejora la noche en {improved_n} de {nights} noches simuladas; lo que vende cada vendedor es un supuesto."
  en: "Removing the ticket window improves the night in {improved_n} of {nights} simulated nights; what each seller sells is an assumption."
ev_crew_rule:
  es: "El personal recomendado se eligió entre combinaciones casi iguales por su resultado en siete casos de estrés."
  en: "The recommended crew was chosen among nearly equal mixes by its results in seven stress cases."
ev_h10: {es: "Datos que mejorarían el plan", en: "Records that would improve the plan"}
ev_lead10:
  es: "Con sus datos los rangos se reducen y el plan se ajusta a su operación."
  en: "With your records the ranges narrow and the plan fits your operation."
ev_h11: {es: "Cómo se hizo", en: "How this was done"}
ev_lead11:
  es: "Una simulación por computadora reproduce la noche de 2026 y prueba cada cambio en las mismas noches."
  en: "A computer simulation reproduces the 2026 night and tests each change on the same nights."
