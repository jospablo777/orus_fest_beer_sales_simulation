# Text of the organizer pages (site/index.qmd in Spanish, site/en.qmd in English).
# Placeholders in braces are filled by site/_organizer.py from the simulation outputs.

lede:
  es: "En Orus Fest 2026, entre las {obs_from} y las {obs_to}, la fila para canjear una cerveza tomó más de 40 minutos con las fichas ya compradas. Quien no tenía fichas hacía antes la fila de la caja. Con un cambio en la forma de cobrar y el personal indicado abajo, en la noche típica 9 de cada 10 compradores reciben su cerveza en {plan_p90} minutos o menos, y en 19 de cada 20 noches simuladas en {plan_p90_bad} minutos o menos."
  en: "At Orus Fest 2026, between {obs_from} and {obs_to}, the line to exchange tickets for a beer took more than 40 minutes with the tickets already bought. A person without tickets stood in the ticket line first. With one change in how drinks are paid for and the crew listed below, on the typical night 9 of 10 buyers get their beer in {plan_p90} minutes or less, and in 19 of 20 simulated nights in {plan_p90_bad} minutes or less."

h_old:
  es: "Cómo se compraba en 2026"
  en: "How a beer was bought in 2026"
old_text:
  es: "Una sola ventanilla vendía las fichas de todas las bebidas. Con las fichas en la mano había que formarse otra vez para canjearlas. La fila de fichas, la de cocteles y las dos de cerveza salían de la barra hacia el escenario, y las de cocteles y cerveza llegaban hasta la cabina de luces y drones a media pista. A las 15:30 comprar era relativamente rápido, y entre las {obs_from} y las {obs_to} la fila de canje tomaba más de 40 minutos; eso lo vimos. La espera más larga no la medimos. Reconstruimos esa noche en una simulación por computadora, y lo que sigue son estimaciones. La noche solo se reproduce con entre {pour_lo} y {pour_hi} personas sirviendo cerveza. Entre las {obs_from} y las {obs_to} la simulación estima unas {q1} personas en la fila de fichas (entre {q1_lo} y {q1_hi}) y {q2} en las filas de canje (entre {q2_lo} y {q2_hi}). Después de las 20:00 ya no intentamos comprar. Para las 22:00 la simulación estima {night_wait} minutos en la fila de canje (entre {night_wait_lo} y {night_wait_hi})."
  en: "One window sold the tickets for every drink. With the tickets in hand, people stood in line again to exchange them. The ticket line, the cocktail line and the two beer lines ran from the bar toward the stage, and the cocktail and beer lines reached the lighting and drone booth in the middle of the floor. At 15:30 buying was relatively quick, and between {obs_from} and {obs_to} the exchange line took more than 40 minutes; we saw that. We did not measure the longest wait. We rebuilt that night in a computer simulation, and what follows are estimates. The night is reproduced only with {pour_lo} to {pour_hi} people serving beer. Between {obs_from} and {obs_to} the simulation estimates about {q1} people in the ticket line (between {q1_lo} and {q1_hi}) and {q2} in the exchange lines (between {q2_lo} and {q2_hi}). After 20:00 we stopped trying to buy. For 22:00 the simulation estimates {night_wait} minutes in the exchange line (between {night_wait_lo} and {night_wait_hi})."

h_new:
  es: "Cómo se compra con el plan"
  en: "How a beer is bought under the plan"
new_text:
  es: "La caja de fichas desaparece. Cada puesto de la barra cobra con tarjeta o efectivo y entrega la cerveza en el mismo momento. Todo el personal de la barra cobra y sirve. Los cocteles se siguen vendiendo en su lugar de 2026."
  en: "The ticket window is removed. Every serving station at the bar takes card or cash and hands over the beer in the same visit. Everyone at the bar takes payment and serves. Cocktails are still sold where they were in 2026."

h_gain:
  es: "Qué gana cada quien"
  en: "What each group gains"
tile_audience_v: {es: "40+ → {plan_wait} min", en: "40+ → {plan_wait} min"}
tile_audience:
  es: "<strong>Un público más contento.</strong> Tiempo en la fila para recibir la cerveza entre las {obs_from} y las {obs_to}. En 2026 vimos más de 40 minutos en la fila de canje; la simulación estima {base_exchange} (entre {base_exchange_lo} y {base_exchange_hi}). Con el plan la fila toma {plan_wait}."
  en: "<strong>A happier audience.</strong> Time in line to get the beer between {obs_from} and {obs_to}. In 2026 we saw more than 40 minutes in the exchange line; the simulation estimates {base_exchange} (between {base_exchange_lo} and {base_exchange_hi}). Under the plan the line takes {plan_wait}."
tile_staff_v: {es: "{base_maxq} → {plan_maxq}", en: "{base_maxq} → {plan_maxq}"}
tile_staff:
  es: "<strong>Menos presión para el personal.</strong> Máximo estimado de personas formadas al mismo tiempo (en 2026 entre {base_maxq_lo} y {base_maxq_hi}). Las compras abandonadas en la noche bajan de unas {base_lost} (entre {base_lost_lo} y {base_lost_hi}) a {plan_lost}."
  en: "<strong>Less stress for the staff.</strong> Estimated most people standing in line at the same time (in 2026 between {base_maxq_lo} and {base_maxq_hi}). Purchases abandoned during the night drop from about {base_lost} (between {base_lost_lo} and {base_lost_hi}) to {plan_lost}."
tile_sales_v: {es: "+{d_beers}", en: "+{d_beers}"}
tile_sales:
  es: "<strong>Más bebidas vendidas.</strong> Cervezas adicionales por noche (entre {d_beers_lo} y {d_beers_hi}). A {price} pesos la cerveza son cerca de {d_mxn} pesos más en ventas. Cada hora de trabajo adicional vende unas {per_hour} cervezas, unos {per_hour_mxn} pesos. Sin contar costos."
  en: "<strong>More drinks sold.</strong> Extra beers per night (between {d_beers_lo} and {d_beers_hi}). At MXN {price} a beer that is about MXN {d_mxn} more in sales. Each extra staff hour sells about {per_hour} beers, about MXN {per_hour_mxn}. Costs not included."
tile_reputation_v: {es: "{base_hours} → {plan_hours} h", en: "{base_hours} → {plan_hours} h"}
tile_reputation:
  es: "<strong>Mejor reputación para Orus Producciones.</strong> Horas que el público pasa en filas y pierde del show, sumando a todas las personas (estimado; en 2026 entre {base_hours_lo} y {base_hours_hi}). La noche mejora en {improved_n} de {nights} noches simuladas."
  en: "<strong>A better reputation for Orus Producciones.</strong> Hours the audience spends in lines and loses from the show, adding everyone up (estimated; in 2026 between {base_hours_lo} and {base_hours_hi}). The night improves in {improved_n} of {nights} simulated nights."

h_plan:
  es: "El plan en seis acciones"
  en: "The plan in six actions"
plan_alt:
  es: "Plano del salón con el plan: puestos de la barra con carriles, vendedores en pista y pasillo central libre"
  en: "Floor plan of the hall under the plan: bar stations with lanes, sellers on the floor and an open central walkway"
a1_t: {es: "Cobrar y servir en el mismo puesto.", en: "Take payment where the beer is served."}
a1:
  es: "Tarjeta o efectivo en cada puesto de la barra. Sin caja de fichas y sin segunda fila."
  en: "Card or cash at every station of the bar. No ticket window and no second line."
a2_t: {es: "{crew_es} para {tickets} boletos.", en: "{crew_en} for {tickets} tickets."}
a2:
  es: "{rec_sentence_es} {min_sentence_es} En 2026 atendían la cerveza unas {staff_2026} personas contando la ventanilla (entre {staff_2026_lo} y {staff_2026_hi}); el plan usa {staff_plan}. Todos en su puesto antes de las 18:00, que es cuando empezaron las filas en 2026."
  en: "{rec_sentence_en} {min_sentence_en} In 2026 about {staff_2026} people handled beer, counting the ticket window (between {staff_2026_lo} and {staff_2026_hi}); the plan uses {staff_plan}. Everyone in place before 18:00, when the 2026 lines started."
rec_sentence:
  es: "Es el personal recomendado: cumple la meta de espera en {rec_met} de {rec_nights} noches simuladas."
  en: "This is the recommended crew: it meets the waiting target in {rec_met} of {rec_nights} simulated nights."
rec_fallback:
  es: "Ninguna opción probada cumple la meta en el {reliability_rec} de las noches, así que este es el personal mínimo: la cumple en {rec_met} de {rec_nights} noches simuladas."
  en: "No option tested meets the target in {reliability_rec} of the nights, so this is the minimum crew: it meets it in {rec_met} of {rec_nights} simulated nights."
min_sentence:
  es: "El mínimo es {min_crew_es}, que cumple en {min_met} de {min_nights}; en una noche mala (1 de cada 10) 9 de cada 10 compradores esperan hasta {min_bad} minutos, y si faltan dos personas en la barra cumple en {min_absent_met} de {min_absent_nights}."
  en: "The minimum is {min_crew_en}, which meets it in {min_met} of {min_nights}; on a bad night (1 in 10) 9 of 10 buyers wait up to {min_bad} minutes, and with two bartenders absent it meets it in {min_absent_met} of {min_absent_nights}."
a3_t_sellers: {es: "Vendedores en pista de {sellers_from} a {sellers_to}.", en: "Sellers on the floor from {sellers_from} to {sellers_to}."}
a3_sellers:
  es: "Llevan cerveza a quienes guardan su lugar frente al escenario durante las bandas principales. Venden cerca del {seller_share} de la cerveza del plan. {alt_es}"
  en: "They take beer to the people holding a place in front of the stage during the main bands. They sell about {seller_share} of the beer under the plan. {alt_en}"
a3_t_none: {es: "Vendedores en pista solo si faltan puestos en la barra.", en: "Sellers on the floor only if the bar is short of stations."}
a3_none:
  es: "Con los puestos indicados la barra alcanza. Si el mostrador no da para tantos puestos, los vendedores cubren la diferencia."
  en: "With the stations listed the bar is enough. If the counter cannot fit that many stations, sellers cover the difference."
alt_ok:
  es: "Sin vendedores, {alt_crew_es} cumplen la meta en {alt_met} de {alt_nights} noches simuladas; esa es la alternativa si no hay vendedores."
  en: "Without sellers, {alt_crew_en} meet the target in {alt_met} of {alt_nights} simulated nights; that is the alternative if there are no sellers."
alt_none:
  es: "Sin vendedores, ninguna opción probada cumple la meta: con {alt_crew_es} se cumple en {alt_met} de {alt_nights} noches simuladas."
  en: "Without sellers, no option tested meets the target: with {alt_crew_en} it is met in {alt_met} of {alt_nights} simulated nights."
alt_crew:
  es: "12 puestos en la barra y una segunda barra de 4 puestos"
  en: "12 stations at the bar and a second bar with 4 stations"
a4_t: {es: "Un carril con vallas o unifilas por puesto.", en: "One lane with barriers per station."}
a4:
  es: "Las filas avanzan derechas hacia la barra y dejan libre la pista. Esta acción viene de las guías de manejo de multitudes; la simulación no la mide."
  en: "Lines run straight to the bar and leave the floor free. This action comes from crowd-management guidance; the simulation does not measure it."
a5_t: {es: "Pista central libre y venta de boletos dentro del aforo autorizado.", en: "Open central floor and ticket sales within the licensed capacity."}
a5:
  es: "Con {tickets} boletos hay unas {inside_peak} personas dentro en el momento más lleno. {cap_sentence_es}"
  en: "With {tickets} tickets about {inside_peak} people are inside at the fullest moment. {cap_sentence_en}"
a6_t: {es: "Límite de bebidas por compra, agua gratis y seguridad junto a la barra.", en: "A limit of drinks per purchase, free water and security next to the bar."}
a6:
  es: "Con un servicio más rápido la gente bebe más. Quienes toman 6 cervezas o más pasan del {heavy_base} al {heavy_plan} del público. El personal no debe servir a personas visiblemente ebrias."
  en: "With faster service people drink more. Attendees with 6 beers or more go from {heavy_base} to {heavy_plan} of the audience. Staff should refuse service to visibly intoxicated people."

h_video:
  es: "Así se ve la noche"
  en: "Watch the night"
video_night:
  es: "La misma noche con las dos formas de vender, de {clip_from} a {clip_to}. Cada punto es una persona. A la izquierda, 2026. A la derecha, el plan. Después de las 20:00 el lado de 2026 es una estimación."
  en: "The same night under both ways of selling, {clip_from} to {clip_to}. Each dot is one person. On the left, 2026. On the right, the plan. After 20:00 the 2026 side is an estimate."
video_change:
  es: "Cámara lenta del momento más pesado de la noche. Funker Vogt termina a las 21:25 y el público va por cerveza antes de Peter Heppner. A esa hora el lado de 2026 es una estimación."
  en: "Slow motion of the heaviest moment of the night. Funker Vogt ends at 21:25 and the audience goes for beer before Peter Heppner. At that hour the 2026 side is an estimate."

h_staff:
  es: "Personal y ventas por hora"
  en: "Staff and sales by the hour"
staff_text:
  es: "La meta es que 9 de cada 10 compradores esperen {target_wait} minutos o menos entre las {svc_from} y las {svc_to}. Cada barra de la gráfica es una opción de personal y muestra en cuántas de {crew_nights} noches simuladas se cumple la meta. El personal mínimo es la opción con menos horas de trabajo que la cumple en al menos el {reliability} de las noches, y el recomendado la que la cumple en al menos el {reliability_rec}. La gráfica incluye las dos y todas las opciones con menos horas.{alone_sentence_es}"
  en: "The target is that 9 of 10 buyers wait {target_wait} minutes or less between {svc_from} and {svc_to}. Each bar of the chart is a crew option and shows in how many of {crew_nights} simulated nights the target is met. The minimum crew is the option with the fewest working hours that meets it in at least {reliability} of the nights, and the recommended crew the one that meets it in at least {reliability_rec}. The chart includes both and every option with fewer hours.{alone_sentence_en}"
alone_sentence:
  es: " También incluye la opción sin vendedores más chica que cumple la meta en al menos el {reliability} de las noches."
  en: " It also includes the smallest option without sellers that meets the target in at least {reliability} of the nights."
staff_table_head:
  es: ["Boletos", "Personal", "Puestos en la barra", "Vendedores en pista", "Noches que cumplen la meta", "Personas dentro en el pico"]
  en: ["Tickets", "Crew", "Stations at the bar", "Sellers on the floor", "Nights that meet the target", "People inside at the peak"]
crew_level:
  minimum: {es: "mínimo", en: "minimum"}
  recommended: {es: "recomendado", en: "recommended"}
  fallback: {es: "recomendado (igual al mínimo)", en: "recommended (same as minimum)"}
staff_none:
  es: "ninguna opción probada cumple la meta"
  en: "no option tested meets the target"
sales_text:
  es: "La venta sigue al horario de las bandas. Antes de las 18:00 se venden menos de {low_hour} cervezas por hora. La hora más fuerte llega a unas {peak_hour} cervezas (entre {peak_hour_lo} y {peak_hour_hi}). Se estima que en 2026 la hora más fuerte de la barra fue de unas {base_peak_hour} cervezas (entre {base_peak_hour_lo} y {base_peak_hour_hi})."
  en: "Sales follow the running order. Before 18:00 fewer than {low_hour} beers are sold per hour. The busiest hour reaches about {peak_hour} beers (between {peak_hour_lo} and {peak_hour_hi}). In 2026 the busiest hour of the bar is estimated at about {base_peak_hour} beers (between {base_peak_hour_lo} and {base_peak_hour_hi})."
whatif_intro:
  es: "Probamos el plan en noches distintas. La tabla da la espera de 9 de cada 10 compradores en la noche típica y en cuántas de {wi_nights} noches simuladas se cumple la meta de {target_wait} minutos."
  en: "We tried the plan on different nights. The table gives the wait of 9 of 10 buyers on the typical night and in how many of {wi_nights} simulated nights the {target_wait}-minute target is met."
whatif_head:
  es: ["Caso", "Espera de 9 de cada 10 (min, noche típica)", "Noches que cumplen la meta"]
  en: ["Case", "Wait of 9 of 10 buyers (min, typical night)", "Nights that meet the target"]
whatif_miss:
  es: "No cumplen la meta en al menos el {reliability} de las noches: {cases}."
  en: "These cases do not meet the target in at least {reliability} of the nights: {cases}."
whatif_all_ok:
  es: "Todos los casos cumplen la meta en al menos el {reliability} de las noches."
  en: "Every case meets the target in at least {reliability} of the nights."

wi_case:
  plan: {es: "El plan, personal recomendado", en: "The plan, recommended crew"}
  plan_minimum: {es: "El plan con el personal mínimo", en: "The plan with the minimum crew"}
  plan_two_absent: {es: "Faltan dos personas en la barra", en: "Two bartenders are absent"}
  plan_minimum_two_absent: {es: "Personal mínimo y faltan dos personas", en: "Minimum crew and two bartenders absent"}
  plan_sold_out: {es: "Se venden 2,500 boletos", en: "2,500 tickets are sold"}
  plan_thirsty: {es: "El público bebe 30% más", en: "The audience drinks 30% more"}
  plan_slow_pay: {es: "Cobrar toma 25 segundos", en: "Payment takes 25 seconds"}
  plan_late_sellers: {es: "Los vendedores empiezan a las 19:00", en: "Sellers start at 19:00"}
  plan_slow_refill: {es: "Un vendedor tarda 4 minutos en recargar", en: "A seller refill takes 4 minutes"}
  no_sellers: {es: "Sin vendedores: 12 puestos y una segunda barra de 4", en: "No sellers: 12 stations and a second bar with 4"}

h_serve:
  es: "Servir más rápido"
  en: "Serving faster"
serve_intro:
  es: "En 2026 cada cerveza se destapaba y se servía en un vaso, y una grande llevaba dos. Probamos otras formas de servir en las mismas {serve_nights} noches simuladas, con {tickets} boletos. Nadie midió cuánto tiempo ahorra cada una, así que los segundos de la tabla son supuestos nuestros."
  en: "In 2026 every beer was opened and poured into a cup, and a large beer took two. We tried other ways of serving on the same {serve_nights} simulated nights, with {tickets} tickets. Nobody measured how much time each one saves, so the seconds in the table are our assumptions."
serve_head:
  es: ["Forma de servir", "Supuesto", "Personal mínimo (90% de las noches)", "Personal recomendado (95%)", "Espera de 9 de cada 10 con el personal del plan (min, noche típica / noche mala)"]
  en: ["Way of serving", "Assumption", "Minimum crew (90% of nights)", "Recommended crew (95%)", "Wait of 9 of 10 buyers with the plan crew (min, typical night / bad night)"]
serve_best:
  es: "Con {best_label} el personal recomendado es {best_crew}, unas {hours} horas de trabajo menos por noche que sirviendo en vaso{sellers_note}."
  en: "With {best_label} the recommended crew is {best_crew}, about {hours} fewer working hours per night than serving in cups{sellers_note}."
serve_fewer_sellers:
  es: ", y depende menos de los vendedores: {s} en lugar de {b}"
  en: ", and it depends less on sellers: {s} in place of {b}"
serve_none:
  es: "Ninguna de estas formas reduce el personal recomendado; con el mismo personal la espera cambia como indica la tabla."
  en: "None of these ways reduces the recommended crew; with the same crew the wait changes as the table shows."
serve_notes:
  es: "Entregar latas cerradas depende de las reglas del salón y de seguridad sobre latas en la pista. La cerveza de barril necesita barriles fríos, gas y espacio en la barra, y el salón quizá no está preparado para eso; conviene preguntarlo antes de decidir. Cronometrar unas cuantas ventas en la próxima edición diría cuánto ahorra cada opción en realidad."
  en: "Handing over closed cans depends on the venue's rules and on security policy about cans on the floor. Draft beer needs cold kegs, gas and space at the bar, and the venue may not be equipped for it; ask before deciding. Timing a few sales at the next edition would show how much each option really saves."
serve_option:
  bottles: {es: "Botella o lata destapada y servida en vaso (como en 2026)", en: "Bottle or can opened and poured into a cup (as in 2026)"}
  cans: {es: "Latas cerradas", en: "Closed cans"}
  cans_low: {es: "Latas cerradas, ahorro chico", en: "Closed cans, small saving"}
  cans_high: {es: "Latas cerradas, ahorro grande", en: "Closed cans, large saving"}
  tap: {es: "Cerveza de barril", en: "Draft beer"}
  fast_pay: {es: "Cobro más rápido (tarjeta sin contacto o pulsera, precio redondo)", en: "Faster payment (contactless card or wristband, a round price)"}
  cans_fast_pay: {es: "Latas cerradas y cobro más rápido", en: "Closed cans and faster payment"}
serve_assumption:
  bottles: {es: "tiempo ajustado a 2026", en: "time fitted to 2026"}
  cans: {es: "12 s menos por cerveza", en: "12 s less per beer"}
  cans_low: {es: "8 s menos por cerveza", en: "8 s less per beer"}
  cans_high: {es: "20 s menos por cerveza", en: "20 s less per beer"}
  tap: {es: "6 s menos por cerveza, con cambios de barril", en: "6 s less per beer, keg changes included"}
  fast_pay: {es: "cobrar toma 6 s en lugar de 15", en: "payment takes 6 s in place of 15"}
  cans_fast_pay: {es: "12 s menos por cerveza y cobro en 6 s", en: "12 s less per beer and payment in 6 s"}

h_conf:
  es: "Qué tan firme es cada resultado"
  en: "How firm each result is"
conf_firm_t: {es: "Firme", en: "Firm"}
conf_firm:
  es: "Quitar la caja de fichas y cobrar en la barra mejora la noche en {improved_n} de {nights} noches simuladas."
  en: "Removing the ticket window and taking payment at the bar improves the night in {improved_n} of {nights} simulated nights."
conf_prob_t: {es: "Probable", en: "Probable"}
conf_prob:
  es: "En el plan los vendedores en pista venden cerca del {seller_share} de la cerveza. En 2026 no hubo vendedores, así que lo que vende cada uno es un supuesto. {alt_sentence_es} Recomendamos probar a los vendedores antes en un evento más chico y anotar cuántas cervezas vende cada uno por hora y cuánto tarda en recargar. El tiempo para servir una cerveza tampoco se midió en 2026; conviene cronometrarlo y tener una persona de reserva."
  en: "Under the plan the floor sellers sell about {seller_share} of the beer. There were no sellers in 2026, so what each one sells is an assumption. {alt_sentence_en} We recommend trying the sellers first at a smaller event and recording how many beers each one sells per hour and how long a refill takes. The time to serve a beer was not measured in 2026 either; time it and keep one person in reserve."
conf_check_t: {es: "Por revisar", en: "To be checked"}
conf_check:
  es: "La espera más larga de 2026 no se midió. Vimos más de 40 minutos en la fila de canje, y la simulación supone que la espera típica de esa fila no pasó de {wait_max} minutos, un límite que pusimos nosotros. {no_limit_es} El tamaño del salón se estimó de una imagen satelital con un margen de {hall_side} por lado, así que el límite de boletos por espacio también es aproximado. {cap_strict_es} El aforo autorizado es el que decide. La evacuación y los cocteles quedaron fuera del estudio."
  en: "The longest wait of 2026 was not measured. We saw more than 40 minutes in the exchange line, and the simulation assumes that the typical wait in that line did not pass {wait_max} minutes, a limit we set ourselves. {no_limit_en} The hall size was estimated from a satellite image with a margin of {hall_side} per side, so the ticket limit by floor space is approximate as well. {cap_strict_en} The licensed capacity is what decides. Evacuation and cocktails were left out of the study."
no_limit:
  es: "Sin ese límite la simulación estima {ref_exchange} minutos en la fila de canje (entre {ref_exchange_lo} y {ref_exchange_hi}) en lugar de {base_exchange}, y el personal recomendado sería {ref_crew_es}."
  en: "Without that limit the simulation estimates {ref_exchange} minutes in the exchange line (between {ref_exchange_lo} and {ref_exchange_hi}) instead of {base_exchange}, and the recommended crew would be {ref_crew_en}."
cap_strict:
  es: "La lectura más estricta de la misma norma ({lim_large} personas por m²) pone el límite {cap_large_es}."
  en: "The stricter reading of the same code ({lim_large} people per m²) puts the limit {cap_large_en}."

h_need:
  es: "Datos que mejorarían el plan"
  en: "Records that would improve the plan"
need_text:
  es: "Compartir estos datos es opcional. Con ellos el análisis sería más preciso, los rangos de este reporte se reducirían y podríamos ajustar el plan a su operación. Nos sirve cualquiera de ellos, aunque no estén todos."
  en: "Sharing these records is optional. With them the analysis would be more accurate, the ranges in this report would narrow and we could fit the plan to your operation. Any one of them helps, even if not all are available."
needs:
  es:
    - "Cervezas vendidas en la noche (compradas menos sobrantes)."
    - "Boletos vendidos y hora de entrada de cada boleto, de la plataforma de boletos."
    - "Personas en la barra por hora, precios y cuánto se cobró en efectivo y con tarjeta."
    - "Costo de un turno de barra y margen por cerveza, para comparar ventas con costos."
    - "Aforo autorizado del salón, y ubicación y ancho de cada salida."
    - "Fotos o videos de la barra con hora."
  en:
    - "Beers sold during the night (bought minus left over)."
    - "Tickets sold and the entry time of each ticket, from the ticketing platform."
    - "People at the bar by hour, prices, and the split between cash and card."
    - "Cost of a bar shift and margin per beer, to compare sales with costs."
    - "Licensed capacity of the hall, and the position and width of every exit."
    - "Photos or videos of the bar with a time."

h_how:
  es: "Cómo se hizo"
  en: "How this was done"
how_text:
  es: "Un modelo por computadora mueve a {tickets} asistentes por el salón de las 13:00 a las 03:00 con el horario oficial de las bandas. Cada persona llega, ve a sus bandas, tiene sed, elige fila y se cansa de esperar. Lo que nadie midió (cuánto bebe la gente, cuánto tarda servir) se probó en {sims} noches simuladas, y se conservaron las que reproducen lo que vimos en 2026: compra relativamente rápida a las 15:30, más de 40 minutos en la fila de canje entre las {obs_from} y las {obs_to} (y no más de {wait_max}, el límite que supusimos), filas largas tanto en fichas como en canje, y mucha gente que se daba por vencida. Cada cambio se evaluó en {nights} de esas noches. El detalle está en las páginas técnicas, en inglés."
  en: "A computer model moves {tickets} attendees through the hall from 13:00 to 03:00 on the official running order. Each person arrives, watches their bands, gets thirsty, picks a line and gives up after waiting too long. What nobody measured (how much people drink, how long serving takes) was tried in {sims} simulated nights, and the ones that reproduce what we saw in 2026 were kept: a relatively quick purchase at 15:30, more than 40 minutes in the exchange line between {obs_from} and {obs_to} (and no more than {wait_max}, the limit we assumed), long lines at both the ticket window and the exchange, and a lot of people giving up. Each change was evaluated on {nights} of those nights. The details are in the technical pages."
links:
  es: "[Reporte técnico](technical.qmd) · [Métodos](methods.qmd) · [Supuestos](assumptions.qmd) · [Literatura](literature.qmd)"
  en: "[Technical report](technical.qmd) · [Methods](methods.qmd) · [Assumptions](assumptions.qmd) · [Literature](literature.qmd)"

preview_note:
  es: "El reporte técnico, los métodos, los supuestos y la literatura están en el sitio completo del estudio."
  en: "The technical report, methods, assumptions and literature are on the full site of the study."

