project:
  type: website
  output-dir: _site
  pre-render: _sync_assets.py     # figures, videos, docs pages and organizer pages (site/_generated, committed)
  resources:
    - assets/**

website:
  title: "Orus Fest · cerveza sin filas"
  favicon: favicon.svg
  description: "Propuesta para quitar las filas de cerveza en Orus Fest, con una simulación de la edición 2026 en el Salón Olímpico Pantitlán"
  site-url: "https://jospablo777.github.io/orus_fest_beer_sales_simulation/"
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Resumen
      - href: evidencia.qmd
        text: Evidencia
      - text: English
        menu:
          - href: en.qmd
            text: Summary
          - href: evidence.qmd
            text: Evidence
      - text: Técnico
        menu:
          - href: technical.qmd
            text: Technical report
          - href: methods.qmd
            text: Methods
          - href: assumptions.qmd
            text: Assumptions
          - href: literature.qmd
            text: Literature
  page-footer:
    left: "Estudio de simulación para Orus Producciones · Orus Fest 2026, Salón Olímpico Pantitlán"
    right: "Los números se leen de los resultados de la simulación · Numbers are read from the simulation outputs · versión {{< var build >}}"

lang: en

format:
  html:
    theme: [darkly, orus.scss]
    toc: true
    toc-depth: 2
    toc-expand: true
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: true
    fig-cap-location: bottom
    anchor-sections: true
    grid:
      body-width: 940px

execute:
  echo: false
  warning: false
  freeze: auto                    # CI reuses site/_freeze and does not need the simulation outputs
